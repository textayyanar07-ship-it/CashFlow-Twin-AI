<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CashFlow Twin AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- Loading Screen -->
    <div id="loading-screen" class="screen active">
        <div class="content">
            <h1 class="title">CASHFLOW TWIN AI</h1>
            <p class="subtitle">Your Business. Simulated Before It's Live.</p>
            <div class="spinner"></div>
            <p class="status-text">Connecting to servers...</p>
        </div>
    </div>

    <!-- Error Screen -->
    <div id="error-screen" class="screen">
        <div class="content">
            <div class="icon-warning">⚠️</div>
            <h1 class="error-title">Connection Unavailable</h1>
            <p class="error-message">Please check your internet connection and try again.</p>
            <button id="retry-btn" class="btn-retry">Retry Connection</button>
        </div>
    </div>

    <!-- Iframe Container -->
    <iframe id="app-frame" src="about:blank" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

    <!-- Capacitor Core -->
    <script src="capacitor.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
